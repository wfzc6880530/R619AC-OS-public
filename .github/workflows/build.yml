name: Build R619AC OS V0.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test/dualweb-r619ac-128m

concurrency:
  group: r619ac-dualweb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell /usr/local/lib/node_modules
          # Avoid a slow Docker prune on hosted runners; remove large preinstalled SDKs instead.
          sudo apt-get clean || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache golang-go

      - name: Clone OpenWrt 25.12.5
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt describe --tags --always

      - name: Prepare custom packages and feeds
        shell: bash
        run: |
          set -euxo pipefail
          cp feeds.conf.default openwrt/feeds.conf.default
          git clone --depth=1 https://github.com/wfzc6880530/R619AC-OS-fixed.git r619ac-custom
          cp -a r619ac-custom/package/luci-app-r619ac openwrt/package/
          cp -a r619ac-custom/package/luci-theme-r619ac openwrt/package/
          # HomeProxy is a single-package repository, not a feeds-compatible package index.
          # Put it directly in package/ to avoid scripts/feeds parsing its root Makefile as a feed.
          sed -i '/^src-git homeproxy /d' openwrt/feeds.conf.default
          git clone --depth=1 https://github.com/immortalwrt/homeproxy.git openwrt/package/luci-app-homeproxy
          test -f openwrt/package/luci-app-homeproxy/Makefile
          test -f openwrt/package/luci-app-r619ac/Makefile
          test -f openwrt/package/luci-theme-r619ac/Makefile

      - name: Update and install feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # HomeProxy is cloned directly into package/luci-app-homeproxy, not a feed.
          test -e package/luci-app-homeproxy/Makefile
          test -d feeds/nikki
          test -d feeds/nezha
          test -e package/luci-app-homeproxy/Makefile
          test -e package/feeds/nikki/luci-app-nikki/Makefile
          # Check feed source paths as well as installed package symlinks.
          # On this OpenWrt revision sing-box is supplied by feeds/packages/net/sing-box.
          if [ ! -e feeds/packages/net/sing-box/Makefile ] && \
             [ ! -e package/feeds/packages/sing-box/Makefile ] && \
             [ ! -e package/net/sing-box/Makefile ]; then
            echo 'ERROR: sing-box package required by HomeProxy is missing from source and installed paths'
            find feeds/packages -maxdepth 3 -path '*/sing-box/Makefile' -print || true
            exit 1
          fi
          test -e package/feeds/nezha/luci-app-nezha/Makefile
          if [ ! -e feeds/nikki/mihomo/Makefile ] && \
             [ ! -e feeds/nikki/mihomo-meta/Makefile ] && \
             [ ! -e package/feeds/nikki/mihomo/Makefile ] && \
             [ ! -e package/feeds/nikki/mihomo-meta/Makefile ]; then
            echo 'ERROR: mihomo or mihomo-meta package is missing'
            find feeds/nikki -maxdepth 3 -path '*/Makefile' -print || true
            exit 1
          fi


      - name: Prepare DualWeb ARM overlay
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch test/openbox-artifacts https://github.com/wfzc6880530/dualweb.git dualweb
          test -s dualweb/src/main.go
          test -d dualweb/overlay/www/dualweb
          mkdir -p dualweb/overlay/usr/sbin
          cd dualweb
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags='-s -w' -o overlay/usr/sbin/dualweb-api src/main.go
          chmod 0755 overlay/usr/sbin/dualweb-api
          cd ..
          mkdir -p openwrt/files
          cp -a dualweb/overlay/. openwrt/files/
          chmod 0755 openwrt/files/etc/uci-defaults/99-dualweb
          chmod 0755 openwrt/files/etc/init.d/dualweb-api
          chmod 0755 openwrt/files/etc/init.d/dualweb-firstboot
          chmod 0755 openwrt/files/usr/sbin/dualweb-firstboot-packages
          chmod 0755 openwrt/files/usr/sbin/dualweb-api

      - name: Apply configuration
        shell: bash
        run: |
          set -euxo pipefail
          cp config/r619ac.config openwrt/.config
          cat >> openwrt/.config <<'EOF'
          CONFIG_PACKAGE_nginx=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_jsonfilter=y
          EOF
          cd openwrt
          make defconfig V=s
          grep -qx 'CONFIG_TARGET_ipq40xx=y' .config
          grep -qx 'CONFIG_TARGET_ipq40xx_generic=y' .config
          grep -qx 'CONFIG_TARGET_DEVICE_ipq40xx_generic_DEVICE_p2w_r619ac-128m=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-r619ac=y' .config

      - name: Verify target source
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          grep -RIn 'p2w_r619ac-128m' target/linux/ipq40xx
          test -f target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-r619ac-128m.dts

      - name: Download sources
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          make -j"$(nproc)" download V=s

      - name: Build firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Collect firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p firmware
          find openwrt/bin/targets -type f \( \
            -iname '*r619ac*' -o -name 'profiles.json' -o -name 'sha256sums' -o -name '*.manifest' -o -name 'version.buildinfo' \
          \) -exec cp -t firmware {} +
          test -n "$(find firmware -maxdepth 1 -type f -iname '*r619ac*' -print -quit)"
          (cd firmware && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | xargs -0 sha256sum > SHA256SUMS.txt)
          ls -lah firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: R619AC-V0.6-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 14
