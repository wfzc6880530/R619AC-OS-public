name: Build R619AC OS V0.6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache

      - name: Clone OpenWrt 25.12.5
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt describe --tags --always

      - name: Prepare custom packages and feeds
        shell: bash
        run: |
          set -euxo pipefail
          cp feeds.conf.default openwrt/feeds.conf.default
          cp -a package/luci-app-r619ac openwrt/package/
          cp -a package/luci-theme-r619ac openwrt/package/
          test -f openwrt/package/luci-app-r619ac/Makefile
          test -f openwrt/package/luci-theme-r619ac/Makefile

      - name: Update and install feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          test -d feeds/homeproxy
          test -d feeds/nikki
          test -d feeds/nezha
          test -e package/feeds/homeproxy/luci-app-homeproxy/Makefile
          test -e package/feeds/nikki/luci-app-nikki/Makefile
          test -e package/feeds/nezha/luci-app-nezha/Makefile
          if [ ! -e package/feeds/nikki/mihomo/Makefile ] && [ ! -e package/feeds/nikki/mihomo-meta/Makefile ]; then
            echo 'ERROR: mihomo or mihomo-meta package is missing'
            exit 1
          fi

      - name: Apply configuration
        shell: bash
        run: |
          set -euxo pipefail
          cp config/r619ac.config openwrt/.config
          cd openwrt
          make defconfig V=s
          grep -qx 'CONFIG_TARGET_ipq40xx=y' .config
          grep -qx 'CONFIG_TARGET_ipq40xx_generic=y' .config
          grep -qx 'CONFIG_TARGET_DEVICE_ipq40xx_generic_DEVICE_p2w_r619ac-128m=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-r619ac=y' .config

      - name: Verify target source
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          grep -RIn 'p2w_r619ac-128m' target/linux/ipq40xx
          test -f target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-r619ac-128m.dts

      - name: Download sources
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          make -j"$(nproc)" download V=s

      - name: Build firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Collect firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p firmware
          find openwrt/bin/targets -type f \( \
            -iname '*r619ac*' -o -name 'profiles.json' -o -name 'sha256sums' -o -name '*.manifest' -o -name 'version.buildinfo' \
          \) -exec cp -t firmware {} +
          test -n "$(find firmware -maxdepth 1 -type f -iname '*r619ac*' -print -quit)"
          (cd firmware && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | xargs -0 sha256sum > SHA256SUMS.txt)
          ls -lah firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: R619AC-V0.6-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 14
